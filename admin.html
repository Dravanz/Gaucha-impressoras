<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · Gaúcha Impressoras</title>
  <meta name="theme-color" content="#f6f3ea">
  <link rel="icon" href="img/logo-simbolo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/logo-simbolo.png">
  <link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="adm">
<svg class="sprite" aria-hidden="true">
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="wa" viewBox="0 0 24 24"><path d="M4 20l1.2-4A8.5 8.5 0 1 1 8.4 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8.5c0 3.5 2.8 6.5 6.5 6.5l1-1.6-2-1-1 .9a4.6 4.6 0 0 1-2.4-2.4l.9-1-1-2z"/></symbol>
  <symbol id="printer" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-3M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3-3 6.6-6.6a4 4 0 0 1-5-5L13 5zM3 21l6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="ico-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.1"/></symbol>
  <symbol id="camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="truck" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7" cy="18" r="2" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="18" r="2" fill="#fff" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<!-- Tela de login -->
<section class="login" id="login">
  <div class="login__card crop">
    <a href="./" class="login__logo"><img src="img/logo.svg" alt="Gaúcha Impressoras" width="420" height="211"></a>
    <p class="tag">Área restrita</p>
    <h1 class="login__title">Painel</h1>
    <p class="text" id="login-msg">Entre com a conta Google cadastrada pelo administrador.</p>
    <button class="btn btn--ink btn--block" id="btn-google" type="button">Entrar com Google</button>
    <p class="login__note">Por segurança a sessão expira em 15 minutos e é preciso entrar de novo.</p>
    <a class="login__back" href="./">← Voltar ao site</a>
  </div>
</section>

<!-- Painel -->
<div class="panel" id="panel" hidden>
  <header class="bar">
    <a href="./" class="brand" target="_blank" rel="noopener"><img class="brand__logo" src="img/logo-horizontal.svg" alt="Gaúcha Impressoras" width="168" height="40"></a>
    <div class="bar__right">
      <span class="bar__who" id="who"></span>
      <span class="bar__timer" id="timer" title="Tempo restante da sessão">15:00</span>
      <button class="btn btn--sm btn--ghost" id="btn-sair" type="button">Sair</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Seções do painel"></nav>
  <main class="wrap adm__main">
    <div class="adm__head">
      <h2 class="adm__title" id="tab-title"></h2>
      <div class="adm__actions">
        <button class="btn btn--ink btn--sm" id="btn-novo" type="button">+ Nova</button>
      </div>
    </div>
    <div class="rows" id="rows"></div>
  </main>
</div>

<!-- Formulário de edição -->
<dialog class="dlg" id="dlg">
  <form id="form" method="dialog" novalidate>
    <header class="dlg__head"><h3 id="form-title"></h3><button class="x" type="button" id="btn-fechar" aria-label="Fechar">×</button></header>
    <div class="dlg__body" id="fields"></div>
    <p class="dlg__err" id="form-err" role="alert"></p>
    <footer class="dlg__foot" id="form-foot">
      <button class="btn btn--danger btn--sm" type="button" id="btn-excluir">Excluir</button>
      <button class="btn btn--ink btn--sm" type="submit" id="btn-salvar">Salvar</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
